<!DOCTYPE html>
<html lang="th">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } }

    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

</head>
<body class="bg-gray-100 font-sans pb-40 text-slate-800">

    <!-- Navbar -->

                <!-- Images List -->

                    <label class="border-2 border-dashed border-gray-300 rounded-lg p-4 flex items-center justify-center cursor-pointer hover:bg-gray-50 transition-all text-center h-24 relative overflow-visible gap-4" id="box_mp_list_doc">

                        </div>
                        <div class="text-left label-text">
                            <span class="block font-bold text-gray-700">รายงานคะแนน บัญชีรายชื่อ</span>

                            <span class="block font-bold text-gray-700">(ส.ส.5/11 บช)</span>

                        <input type="file" id="file_mp_list_score" accept="image/png, image/jpeg, image/jpg" class="hidden" onchange="handleFileSelect(this, 'box_mp_list_score')">

        <!-- 3. คะแนน ประชามติ (สีส้ม) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-orange-500 text-white p-3 font-bold flex justify-between items-center">
                <span><i class="fa-solid fa-bullhorn"></i> ส่วนที่ 3: ออกเสียงประชามติ</span>
            </div>
            <div class="p-5 space-y-4">

                    <div>

                    </div>
                    <div>

                    </div>

                        <input type="number" name="ref_bad" inputmode="numeric" class="w-32 p-2 border border-red-200 rounded-lg text-lg font-bold text-red-600 text-center bg-white" placeholder="0" oninput="saveDraft()">
                    </div>

                <!-- Images Ref -->

                    <label class="border-2 border-dashed border-gray-300 rounded-lg p-4 flex items-center justify-center cursor-pointer hover:bg-gray-50 transition-all text-center h-24 relative overflow-visible gap-4" id="box_ref_doc">

                        </div>

                        </div>

            <button type="submit" id="submitBtn" class="w-full py-4 rounded-xl font-bold text-xl text-white bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all shadow-md flex justify-center items-center gap-2">

    </form>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl flex flex-col items-center max-w-xs w-full animate-bounce-in">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-gray-800 font-bold text-lg">กำลังส่งข้อมูล...</p>
            <p id="loadingStatus" class="text-xs text-gray-500 mt-2 text-center">ระบบกำลังบีบอัดและส่งรูปภาพ</p>
        </div>
    </div>

    <script>
        // *** ใส่ URL ของคุณที่นี่ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxGuPCyQCgkfLYimrY3IkuFd5S_lC3EZNgm4sLEQ2K5MTlh30BAkHsRBmkaUW8oLNOl/exec'; 

        let fileStorage = {};

        function updateUnits() {
            const district = document.getElementById('district').value;
            const unitSelect = document.getElementById('unitNo');
            const savedUnit = localStorage.getItem('draft_unitNo');

            unitSelect.innerHTML = '<option value="">เลือกหน่วย...</option>';
            let max = 0;
            if(district === 'บางคอแหลม') max = 27; 
            else if(district === 'วัดพระยาไกร') max = 31; 
            else if(district === 'บางโคล่') max = 48;

            if (max > 0) {
                unitSelect.disabled = false;
                for(let i=1; i<=max; i++) {
                    const opt = document.createElement('option'); 
                    opt.value = i; opt.text = i; 
                    if(savedUnit == i) opt.selected = true;
                    unitSelect.appendChild(opt);
                }
            } else { unitSelect.disabled = true; }
        }

        function handleFileSelect(input, boxId) {
            const box = document.getElementById(boxId);
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                // กรองชนิดไฟล์เบื้องต้น
                if (!file.type.startsWith('image/')) {
                    alert('กรุณาเลือกไฟล์รูปภาพเท่านั้น (JPG/PNG)');
                    input.value = '';
                    return;
                }

                if (!fileStorage[boxId]) fileStorage[boxId] = [];
                fileStorage[boxId].push(file);
                updateBoxUI(boxId, file);
                input.value = '';
            }
        }

        function updateBoxUI(boxId, latestFile) {
            const box = document.getElementById(boxId);
            const count = fileStorage[boxId] ? fileStorage[boxId].length : 0;
            const iconContainer = box.querySelector('.icon-container');
            const labelText = box.querySelector('.label-text');

            if (count > 0) {
                // ใช้ URL.createObjectURL เพื่อความรวดเร็วและประหยัด RAM ในการพรีวิว
                const objectUrl = URL.createObjectURL(latestFile);
                
                box.style.backgroundImage = `url('${objectUrl}')`;
                box.style.backgroundSize = 'cover';
                box.style.backgroundPosition = 'center';
                box.style.backgroundRepeat = 'no-repeat';
                box.classList.add('border-blue-500', 'ring-2', 'ring-blue-100');
                
                if(iconContainer) iconContainer.style.opacity = '0';
                if(labelText) labelText.style.opacity = '0';

                let badge = box.querySelector('.count-badge');
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'count-badge';
                    box.appendChild(badge);
                }
                badge.innerText = count;

                if(!box.querySelector('.remove-btn')) {
                    const btn = document.createElement('div');
                    btn.className = 'remove-btn absolute -top-2 -left-2 bg-red-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm shadow cursor-pointer z-30 border-2 border-white hover:bg-red-600';
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                    btn.onclick = (e) => {
                        e.preventDefault(); e.stopPropagation();
                        if(confirm(`ลบรูปภาพทั้งหมดในช่องนี้?`)) {
                            fileStorage[boxId] = []; 
                            box.style.backgroundImage = '';
                            box.classList.remove('border-blue-500', 'ring-2', 'ring-blue-100');
                            if(iconContainer) iconContainer.style.opacity = '1';
                            if(labelText) labelText.style.opacity = '1';
                            if(badge) badge.remove();
                            btn.remove();
                        }
                    };
                    box.appendChild(btn);
                }
            }
        }

        // ปรับปรุงฟังก์ชันบีบอัดรูปภาพเพื่อลดการใช้ RAM บนมือถือ
        const compressImage = (file) => new Promise((resolve, reject) => {
            // เช็คว่าเป็นรูปภาพจริงหรือไม่
            if (!file.type.match(/image.*/)) {
                reject(new Error("ไฟล์ไม่ใช่รูปภาพ หรือรูปแบบไม่รองรับ"));
                return;
            }

            const url = URL.createObjectURL(file); // สร้าง Blob URL แทนการอ่านทั้งไฟล์ (ประหยัด RAM)
            const img = new Image();
            
            img.onload = () => {
                URL.revokeObjectURL(url); // คืนค่า RAM ทันทีที่โหลดเสร็จ
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // ลดขนาดสูงสุดลงเล็กน้อยเพื่อความเสถียรบน Android รุ่นเก่า
                const MAX_WIDTH = 1000; 
                let width = img.width;
                let height = img.height;
                
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                
                canvas.width = width; 
                canvas.height = height;
                
                // วาดลง Canvas
                ctx.drawImage(img, 0, 0, width, height);
                
                // แปลงเป็น JPEG คุณภาพ 70%
                resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
            };
            
            img.onerror = (e) => {
                URL.revokeObjectURL(url);
                reject(new Error("ไม่สามารถอ่านไฟล์รูปภาพได้ (อาจเป็นไฟล์เสีย หรือนามสกุล HEIC)"));
            };

            img.src = url;
        });

        function saveDraft() {
            const inputs = document.querySelectorAll('input[type="number"], select');
            inputs.forEach(input => {
                if(input.id) localStorage.setItem('draft_' + input.id, input.value);
                if(input.name) localStorage.setItem('draft_' + input.name, input.value);
            });
        }

        function restoreDraft() {
            const district = localStorage.getItem('draft_district');
            if(district) {
                document.getElementById('district').value = district;
                updateUnits();
            }
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                const val = localStorage.getItem('draft_' + input.name);
                if(val) input.value = val;
            });
        }
        function clearDraft() {
            if(confirm('ล้างข้อมูลทั้งหมด?')) { localStorage.clear(); window.location.reload(); }
        }
        window.onload = restoreDraft;

        async function submitForm(e) {
            e.preventDefault();
            const district = document.getElementById('district').value;
            const unit = document.getElementById('unitNo').value;
            
            if(!district || !unit) { alert('กรุณาเลือกแขวงและหน่วยเลือกตั้ง'); return; }

            if(!confirm("ยืนยันการส่งข้อมูล?")) return;

            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = true;
            const loadingStatus = document.getElementById('loadingStatus');

            try {
                // Prepare Payload Structure
                const formData = {
                    district: district, unitNo: unit,
                    mpZone: {
                        eligible: document.querySelector('[name="mp_zone_eligible"]').value,
                        voted: document.querySelector('[name="mp_zone_voted"]').value,
                        good: document.querySelector('[name="mp_zone_good"]').value,
                        bad: document.querySelector('[name="mp_zone_bad"]').value,
                        noVote: document.querySelector('[name="mp_zone_novote"]').value
                    },
                    mpList: {
                        eligible: document.querySelector('[name="mp_list_eligible"]').value,
                        voted: document.querySelector('[name="mp_list_voted"]').value,
                        good: document.querySelector('[name="mp_list_good"]').value,
                        bad: document.querySelector('[name="mp_list_bad"]').value,
                        noVote: document.querySelector('[name="mp_list_novote"]').value
                    },
                    ref: {
                        eligible: document.querySelector('[name="ref_eligible"]').value,
                        voted: document.querySelector('[name="ref_voted"]').value,
                        good: document.querySelector('[name="ref_good"]').value,
                        bad: document.querySelector('[name="ref_bad"]').value
                    },
                    files: []
                };

                const fileMapping = [
                    {boxId: 'box_mp_zone_doc', prefix: 'MP_ZONE_DOC'},
                    {boxId: 'box_mp_zone_score', prefix: 'MP_ZONE_SCORE'},
                    {boxId: 'box_mp_list_doc', prefix: 'MP_LIST_DOC'},
                    {boxId: 'box_mp_list_score', prefix: 'MP_LIST_SCORE'},
                    {boxId: 'box_ref_doc', prefix: 'REF_DOC'},
                    {boxId: 'box_ref_score', prefix: 'REF_SCORE'}
                ];

                let totalFiles = 0;
                fileMapping.forEach(m => { if(fileStorage[m.boxId]) totalFiles += fileStorage[m.boxId].length; });
                
                let processedCount = 0;
                for (const item of fileMapping) {
                    const files = fileStorage[item.boxId];
                    if (files && files.length > 0) {
                        for (let i = 0; i < files.length; i++) {
                            processedCount++;
                            loadingStatus.innerHTML = `กำลังย่อรูปที่ ${processedCount}/${totalFiles}<br><span class="text-xs">รูปภาพขนาดใหญ่อาจใช้เวลาสักครู่...</span>`;
                            
                            try {
                                const compressedBase64 = await compressImage(files[i]);
                                formData.files.push({
                                    name: `${item.prefix}_${i+1}.jpg`,
                                    type: 'image/jpeg',
                                    data: compressedBase64
                                });
                            } catch (imgError) {
                                console.error("Image Error:", imgError);
                                alert(`พบปัญหาที่รูปภาพในช่อง: ${item.prefix} รูปที่ ${i+1}\n(ระบบจะข้ามรูปนี้ไป)`);
                            }
                        }
                    }
                }

                loadingStatus.innerText = "กำลังอัปโหลดขึ้น Server...";
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(formData) });
                
                localStorage.clear();
                alert('✅ ส่งข้อมูลสำเร็จ!');
                window.location.reload();

            } catch (error) {
                console.error(error); 
                alert('Error การส่งข้อมูล: ' + error.message + '\n(ลองลดจำนวนรูปภาพหรือตรวจสอบอินเทอร์เน็ต)');
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('submitBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
